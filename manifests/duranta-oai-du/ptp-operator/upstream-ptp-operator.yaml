apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
  name: webhook-service
  namespace: openshift-ptp
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    name: ptp-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
  name: ptp-operator
  namespace: openshift-ptp
spec:
  replicas: 1
  selector:
    matchLabels:
      name: ptp-operator
  template:
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        name: ptp-operator
        role: ptp
    spec:
      containers:
      - args:
        - --enable-leader-election
        - --logtostderr
        - --stderrthreshold=INFO
        command:
        - ptp-operator
        env:
        - name: OPERATOR_NAME
          value: ptp-operator
        - name: RELEASE_VERSION
          value: v5.0.0
        - name: LINUXPTP_DAEMON_IMAGE
          value: quay.io/openshift/origin-ptp:5.0
        - name: KUBE_RBAC_PROXY_IMAGE
          value: quay.io/openshift/origin-kube-rbac-proxy:5.0
        - name: SIDECAR_EVENT_IMAGE
          value: quay.io/openshift/origin-cloud-event-proxy:5.0
        - name: EVENT_PROXY_IMAGE
          value: ""
        - name: LINUXPTP_VERBOSITY
          value: "10"
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: WATCH_NAMESPACE
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: ghcr.io/k8snetworkplumbingwg/ptp-operator:5.0
        imagePullPolicy: IfNotPresent
        name: ptp-operator
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      nodeSelector:
        node-role.kubernetes.io/master: ""
      priorityClassName: system-node-critical
      serviceAccountName: ptp-operator
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ptpconfig-minoffsetthreshold-deprecation
  namespace: openshift-ptp
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ptp.openshift.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ptpconfigs
  validations:
  - expression: |-
      !object.spec.profile.exists(p,

        has(p.ptpClockThreshold) &&
        has(p.ptpClockThreshold.minOffsetThreshold) &&
        p.ptpClockThreshold.minOffsetThreshold != 0)
    message: minOffsetThreshold is deprecated and ignored; the system now evaluates
      abs(offset) < maxOffsetThreshold only. Remove minOffsetThreshold from this PtpConfig's
      ptpClockThreshold.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ptpconfig-minoffsetthreshold-deprecation-binding
  namespace: openshift-ptp
spec:
  matchResources:
    resourceRules:
    - apiGroups:
      - ptp.openshift.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ptpconfigs
  policyName: ptpconfig-minoffsetthreshold-deprecation
  validationActions:
  - Warn
